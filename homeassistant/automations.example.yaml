# Example Home Assistant automations for CameraProbe.
#
# CameraProbe POSTs to:
#   http://<homeAssistant.host>:<homeAssistant.port>/api/webhook/camera_on
#   http://<homeAssistant.host>:<homeAssistant.port>/api/webhook/camera_off
#
# camera_on includes a form field "application" (the app that grabbed the
# camera, e.g. "Zoom"); camera_off has no body. Home Assistant parses
# form-encoded webhook bodies into `trigger.data`, so the app name is
# available as `trigger.data.application`.
#
# Adjust the entity_id / notify target below to whatever you actually
# want to control - a smart plug, a light, an input_boolean, etc.

automation:
  - alias: "CameraProbe - Camera On"
    trigger:
      - platform: webhook
        webhook_id: camera_on
        # Only accept this webhook from your local network, not the
        # internet, since it's unauthenticated form-encoded POST.
        local_only: true
    action:
      - service: light.turn_on
        target:
          entity_id: light.on_air_sign
      - service: notify.notify
        data:
          message: >-
            Camera turned on
            ({{ trigger.data.application | default('unknown app') }})

  - alias: "CameraProbe - Camera Off"
    trigger:
      - platform: webhook
        webhook_id: camera_off
        local_only: true
    action:
      - service: light.turn_off
        target:
          entity_id: light.on_air_sign
