<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="squircle"><rect x="0" y="0" width="1024" height="1024" rx="224" ry="224"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3a3f47"/>
      <stop offset="100%" stop-color="#1b1d21"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#ff8080"/>
      <stop offset="55%" stop-color="#ff3b3b"/>
      <stop offset="100%" stop-color="#a8121f"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2352f"/>
      <stop offset="100%" stop-color="#b5121f"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#squircle)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <!-- lens ring -->
    <circle cx="512" cy="360" r="220" fill="none" stroke="#8b95a3" stroke-width="26"/>
    <!-- tally light -->
    <circle cx="512" cy="360" r="150" fill="url(#glow)"/>
    <circle cx="512" cy="360" r="150" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.45"/>
    <circle cx="465" cy="315" r="34" fill="#ffffff" opacity="0.35"/>
    <!-- ON AIR badge -->
    <rect x="100" y="672" width="824" height="190" rx="26" fill="url(#badge)"/>
    <rect x="100" y="672" width="824" height="190" rx="26" fill="none" stroke="#ffffff" stroke-width="6" opacity="0.35"/>
    <text x="512" y="808" text-anchor="middle" font-family="'DejaVu Sans','Liberation Sans',sans-serif" font-size="140" font-weight="bold" fill="#ffffff" letter-spacing="4">ON AIR</text>
  </g>
</svg>
