<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" font-family="-apple-system, 'Segoe UI', Arial, sans-serif">
  <title>Sinilink XY-WFUSB USB switch stick: USB-A plug in, switched USB-A socket out, programming holes</title>
  <rect width="760" height="430" fill="#ffffff"/>

  <!-- Title -->
  <text x="380" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1d1d1f">Sinilink XY-WFUSB USB switch stick</text>
  <text x="380" y="56" text-anchor="middle" font-size="13" fill="#6e6e73">Illustration, not to scale - about 63 x 21 x 10 mm</text>

  <!-- ===== Top: the stick ===== -->
  <!-- female socket (OUT) on the left -->
  <rect x="96" y="112" width="34" height="58" rx="3" fill="#c9ccd1" stroke="#8a8f98"/>
  <rect x="102" y="122" width="22" height="38" rx="2" fill="#2b2f36"/>
  <rect x="106" y="130" width="14" height="22" fill="#f2f2f2"/>
  <!-- translucent blue body -->
  <rect x="128" y="96" width="420" height="90" rx="14" fill="#2f6fe0" fill-opacity="0.82" stroke="#1d4fb0" stroke-width="2"/>
  <rect x="140" y="106" width="396" height="20" rx="8" fill="#ffffff" fill-opacity="0.18"/>
  <!-- button -->
  <circle cx="338" cy="141" r="15" fill="#1d4fb0" stroke="#bcd3ff" stroke-width="2"/>
  <circle cx="338" cy="141" r="8" fill="#2f6fe0"/>
  <!-- LEDs -->
  <circle cx="404" cy="130" r="5" fill="#ff3b30"/>
  <circle cx="420" cy="130" r="5" fill="#34c759"/>
  <circle cx="436" cy="130" r="5" fill="#64a8ff" stroke="#ffffff" stroke-width="1"/>
  <!-- male plug (IN) on the right -->
  <rect x="546" y="110" width="94" height="62" rx="2" fill="#d6d9de" stroke="#8a8f98"/>
  <rect x="566" y="126" width="12" height="9" fill="#5a5f68"/>
  <rect x="566" y="147" width="12" height="9" fill="#5a5f68"/>
  <rect x="604" y="126" width="12" height="9" fill="#5a5f68"/>
  <rect x="604" y="147" width="12" height="9" fill="#5a5f68"/>

  <!-- labels -->
  <text x="113" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">OUT</text>
  <text x="113" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">switched 5V</text>
  <text x="113" y="242" text-anchor="middle" font-size="12" fill="#6e6e73">to the light</text>
  <text x="593" y="208" text-anchor="middle" font-size="14" font-weight="700" fill="#1d1d1f">IN</text>
  <text x="593" y="226" text-anchor="middle" font-size="12" fill="#6e6e73">from a USB charger</text>
  <line x1="338" y1="160" x2="338" y2="204" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <text x="338" y="220" text-anchor="middle" font-size="12" fill="#6e6e73">button: toggles the output</text>
  <line x1="420" y1="124" x2="470" y2="82" stroke="#6e6e73" stroke-dasharray="3 3"/>
  <text x="474" y="80" font-size="12" fill="#6e6e73">red and blue = output on; blue blinks in setup</text>

  <!-- ===== Bottom: programming holes ===== -->
  <text x="380" y="282" text-anchor="middle" font-size="15" font-weight="700" fill="#1d1d1f">Programming holes (inside the case) - one-time first flash only</text>
  <rect x="128" y="298" width="420" height="58" rx="6" fill="#1f3d2b" stroke="#0f2418"/>
  <rect x="96" y="306" width="34" height="42" rx="3" fill="#c9ccd1" stroke="#8a8f98"/>
  <rect x="546" y="306" width="94" height="42" rx="2" fill="#d6d9de" stroke="#8a8f98"/>
  <text x="113" y="372" text-anchor="middle" font-size="11" fill="#6e6e73">socket end</text>
  <text x="593" y="372" text-anchor="middle" font-size="11" fill="#6e6e73">plug end</text>
  <g font-size="12" text-anchor="middle">
    <circle cx="258" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="258" y="395" fill="#6e6e73">1 3V3</text>
    <circle cx="290" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="290" y="413" fill="#6e6e73">2 RST</text>
    <circle cx="322" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="322" y="395" fill="#b58900" font-weight="700">3 GPIO0</text>
    <circle cx="354" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="354" y="413" fill="#2e7d32" font-weight="700">4 RX</text>
    <circle cx="386" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="386" y="395" fill="#1565c0" font-weight="700">5 TX</text>
    <circle cx="418" cy="327" r="6" fill="#d4af37" stroke="#8a6d1f"/><text x="418" y="413" fill="#1d1d1f" font-weight="700">6 GND</text>
  </g>
  <g stroke="#9aa0a6" stroke-width="1">
    <line x1="258" y1="335" x2="258" y2="382"/><line x1="290" y1="335" x2="290" y2="400"/>
    <line x1="322" y1="335" x2="322" y2="382"/><line x1="354" y1="335" x2="354" y2="400"/>
    <line x1="386" y1="335" x2="386" y2="382"/><line x1="418" y1="335" x2="418" y2="400"/>
  </g>
  <text x="600" y="400" font-size="11" fill="#6e6e73">1.27 mm pitch;</text>
  <text x="600" y="414" font-size="11" fill="#6e6e73">GND beeps to plug shell</text>
</svg>
